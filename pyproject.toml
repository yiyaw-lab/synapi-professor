[project]
name = "yiyaprofessor"
version = "0.1.0"
description = "A daily professor for the foundations of large language models."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The labs/ notebooks are generated; lint the source of truth, not the output.
extend-exclude = ["labs/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# This is a content-heavy repo: lesson prose and the inlined notebook source in
# labs/_generate.py are long by nature. `ruff format` governs code layout; we do
# not reflow hand-written strings, so line length is not enforced.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["professor.py", "lesson_model.py", "curriculum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
